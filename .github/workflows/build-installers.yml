name: Build Installers

on:
  push:
    branches: [ main, release/* ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          dpkg-dev \
          fakeroot \
          debhelper \
          libwebkit2gtk-4.1-dev \
          libssl-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxrender-dev \
          libxtst-dev \
          libgtk-3-dev
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build release binary
      run: cargo build --release --verbose
    
    - name: Create artifacts directory
      run: mkdir -p artifacts
    
    - name: Prepare Linux binary
      run: |
        if [ -f "target/release/vantisweb" ]; then
          cp target/release/vantisweb artifacts/vantisweb-linux-amd64
          chmod +x artifacts/vantisweb-linux-amd64
        else
          echo "Binary not found!"
          exit 1
        fi
    
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: vantisweb-linux
        path: artifacts/vantisweb-linux-amd64

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build release binary
      run: cargo build --release --verbose
    
    - name: Create artifacts directory
      run: mkdir -p artifacts
      shell: bash
    
    - name: Prepare Windows binary
      run: |
        if [ -f "target/release/vantisweb.exe" ]; then
          cp target/release/vantisweb.exe artifacts/vantisweb-windows-amd64.exe
        else
          echo "Binary not found!"
          exit 1
        fi
      shell: bash
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: vantisweb-windows
        path: artifacts/vantisweb-windows-amd64.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build release binary
      run: cargo build --release --verbose
    
    - name: Create artifacts directory
      run: mkdir -p artifacts
    
    - name: Prepare macOS binary
      run: |
        if [ -f "target/release/vantisweb" ]; then
          cp target/release/vantisweb artifacts/vantisweb-macos-amd64
          chmod +x artifacts/vantisweb-macos-amd64
        else
          echo "Binary not found!"
          exit 1
        fi
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: vantisweb-macos
        path: artifacts/vantisweb-macos-amd64

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/vantisweb-linux/*
          artifacts/vantisweb-windows/*
          artifacts/vantisweb-macos/*
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        body: |
          ## VantisWeb Browser Release
          
          ### Installation
          
          **Linux:**
          Download the appropriate binary and make it executable:
          ```bash
          chmod +x vantisweb-linux-amd64
          ./vantisweb-linux-amd64
          ```
          
          **Windows:**
          Download and run the .exe file
          
          **macOS:**
          Download the binary and make it executable:
          ```bash
          chmod +x vantisweb-macos-amd64
          ./vantisweb-macos-amd64
          ```
          
          ### Features
          - Advanced security and privacy
          - AI-powered ad blocking
          - Built-in password manager
          - VPN client
          - Developer tools
          - Extensions support
          
          ### Changelog
          See [CHANGELOG.md](https://github.com/vantisCorp/VantisWeb/blob/main/CHANGELOG.md) for details.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}