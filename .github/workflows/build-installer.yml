name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.5.0)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
        
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install NSIS
      run: |
        choco install nsis -y
        echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        
    - name: Build release executable
      run: |
        cargo build --release --target x86_64-pc-windows-msvc
        
    - name: Create distribution directory
      run: |
        mkdir -p dist
        mkdir -p assets/icons
        mkdir -p assets/installer
        mkdir -p resources/themes
        
    - name: Create placeholder icon
      if: hashFiles('assets/icons/icon.ico') == ''
      run: |
        # Create a simple placeholder icon using ImageMagick if available
        # Otherwise skip - NSIS will handle missing icon gracefully
        Write-Host "Icon file not found, installer will use default icon"
        
    - name: Copy application files
      run: |
        Copy-Item target/x86_64-pc-windows-msvc/release/VantisWeb.exe dist/ -ErrorAction SilentlyContinue
        Copy-Item README.md dist/ -ErrorAction SilentlyContinue
        Copy-Item LICENSE dist/ -ErrorAction SilentlyContinue
        Copy-Item CHANGELOG.md dist/ -ErrorAction SilentlyContinue
        
    - name: Get version
      id: version
      run: |
        if ("${{ github.event.inputs.version }}" -ne "") {
          $version = "${{ github.event.inputs.version }}"
        } elseif ("${{ github.ref_type }}" -eq "tag") {
          $version = "${{ github.ref_name }}".TrimStart('v')
        } else {
          $version = (Get-Content Cargo.toml | Select-String '^version = "(.+)"' | ForEach-Object { $_.Matches.Groups[1].Value })
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Building version: $version"
        
    - name: Build NSIS installer
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $nsiFile = "installer/windows/installer.nsi"
        
        # Update version in NSIS script
        (Get-Content $nsiFile) -replace '!define PRODUCT_VERSION ".*"', "!define PRODUCT_VERSION `"$version`"" | Set-Content $nsiFile
        
        # Build with NSIS
        & "C:\Program Files (x86)\NSIS\makensis.exe" /V3 /DPRODUCT_VERSION=$version $nsiFile
        
    - name: Rename installer
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        Move-Item VantisWeb-Setup-*.exe "dist/VantisWeb-Setup-$version.exe" -ErrorAction SilentlyContinue
        Move-Item installer/windows/VantisWeb-Setup-*.exe "dist/VantisWeb-Setup-$version.exe" -ErrorAction SilentlyContinue
        
    - name: Create portable package
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        mkdir -p "dist/VantisWeb-Portable-$version"
        Copy-Item target/x86_64-pc-windows-msvc/release/VantisWeb.exe "dist/VantisWeb-Portable-$version/" -ErrorAction SilentlyContinue
        Copy-Item README.md "dist/VantisWeb-Portable-$version/" -ErrorAction SilentlyContinue
        Copy-Item LICENSE "dist/VantisWeb-Portable-$version/" -ErrorAction SilentlyContinue
        Compress-Archive -Path "dist/VantisWeb-Portable-$version" -DestinationPath "dist/VantisWeb-Portable-$version.zip"
        
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: VantisWeb-Installer
        path: dist/*.exe
        retention-days: 30
        
    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: VantisWeb-Portable
        path: dist/*.zip
        retention-days: 30
        
    - name: Create checksums
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        cd dist
        Get-FileHash -Algorithm SHA256 "VantisWeb-Setup-$version.exe" | Select-Object -ExpandProperty Hash | Out-File "VantisWeb-Setup-$version.exe.sha256"
        Get-FileHash -Algorithm SHA256 "VantisWeb-Portable-$version.zip" | Select-Object -ExpandProperty Hash | Out-File "VantisWeb-Portable-$version.zip.sha256"
        
    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: VantisWeb-Checksums
        path: dist/*.sha256
        retention-days: 30

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/VantisWeb-Installer/*.exe
          artifacts/VantisWeb-Portable/*.zip
          artifacts/VantisWeb-Checksums/*.sha256
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}