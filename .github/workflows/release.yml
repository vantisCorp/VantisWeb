name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libatk1.0-dev libsoup-3.0-dev javascriptcoregtk-4.1-dev

    - name: Build release
      run: cargo build --release --verbose

    - name: Create archive (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        if [ -f "target/release/vantisweb" ]; then
          cd target/release
          tar czf ../../vantisweb-${{ matrix.target }}.tar.gz vantisweb
        else
          echo "Binary not found!"
          exit 1
        fi

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        if (Test-Path "target/release/vantisweb.exe") {
          Compress-Archive -Path target/release/vantisweb.exe -DestinationPath vantisweb-${{ matrix.target }}.zip
        } else {
          Write-Host "Binary not found!"
          exit 1
        }
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vantisweb-${{ matrix.target }}
        path: |
          vantisweb-*.tar.gz
          vantisweb-*.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: vantisweb-*

    - name: List artifacts
      run: find artifacts -type f

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update CHANGELOG
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "Release $VERSION created"