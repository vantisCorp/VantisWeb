<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAssembly Test Suite</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .test-section h2 {
            color: #667eea;
            margin-top: 0;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .test-result.pass {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .test-result.fail {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .test-result.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 WebAssembly Test Suite</h1>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Total Tests</h3>
                <div class="value" id="totalTests">0</div>
            </div>
            <div class="stat-card">
                <h3>Passed</h3>
                <div class="value" id="passedTests">0</div>
            </div>
            <div class="stat-card">
                <h3>Failed</h3>
                <div class="value" id="failedTests">0</div>
            </div>
            <div class="stat-card">
                <h3>Success Rate</h3>
                <div class="value" id="successRate">0%</div>
            </div>
        </div>

        <div class="test-section">
            <h2>🚀 Test Controls</h2>
            <button onclick="runAllTests()">Run All Tests</button>
            <button onclick="runBasicTests()">Basic Tests</button>
            <button onclick="runMemoryTests()">Memory Tests</button>
            <button onclick="runFunctionTests()">Function Tests</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>

        <div class="test-section">
            <h2>📊 Test Results</h2>
            <div id="testResults"></div>
        </div>
    </div>

    <script>
        let totalTests = 0;
        let passedTests = 0;
        let failedTests = 0;

        const addWasmBytes = new Uint8Array([
            0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00, 0x01, 0x07, 0x01,
            0x60, 0x02, 0x7f, 0x7f, 0x01, 0x7f, 0x03, 0x02, 0x01, 0x00, 0x07,
            0x07, 0x01, 0x03, 0x61, 0x64, 0x64, 0x00, 0x00, 0x0a, 0x09, 0x01,
            0x07, 0x00, 0x20, 0x00, 0x20, 0x01, 0x6a, 0x0b,
        ]);

        function addResult(testName, passed, message) {
            totalTests++;
            if (passed) passedTests++;
            else failedTests++;

            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `<strong>${testName}</strong>: ${passed ? '✓ PASSED' : '✗ FAILED'}${message ? `<br><small>${message}</small>` : ''}`;
            document.getElementById('testResults').appendChild(resultDiv);
            updateStats();
        }

        function addInfo(message) {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-result info';
            resultDiv.innerHTML = `<strong>ℹ️ INFO</strong>: ${message}`;
            document.getElementById('testResults').appendChild(resultDiv);
        }

        function updateStats() {
            document.getElementById('totalTests').textContent = totalTests;
            document.getElementById('passedTests').textContent = passedTests;
            document.getElementById('failedTests').textContent = failedTests;
            const rate = totalTests > 0 ? ((passedTests / totalTests) * 100).toFixed(1) : 0;
            document.getElementById('successRate').textContent = rate + '%';
        }

        function clearResults() {
            document.getElementById('testResults').innerHTML = '';
            totalTests = 0;
            passedTests = 0;
            failedTests = 0;
            updateStats();
        }

        async function runBasicTests() {
            addInfo('Running basic WebAssembly tests...');
            try {
                const supported = typeof WebAssembly === 'object';
                addResult('WebAssembly Support', supported, supported ? 'WebAssembly is available' : 'WebAssembly is not available');
            } catch (e) {
                addResult('WebAssembly Support', false, e.message);
            }
            try {
                const module = await WebAssembly.instantiate(addWasmBytes);
                addResult('Module Instantiation', true, 'Simple module instantiated successfully');
            } catch (e) {
                addResult('Module Instantiation', false, e.message);
            }
            try {
                const { instance } = await WebAssembly.instantiate(addWasmBytes);
                const hasExport = typeof instance.exports.add === 'function';
                addResult('Function Export', hasExport, hasExport ? 'add function exported' : 'add function not found');
            } catch (e) {
                addResult('Function Export', false, e.message);
            }
        }

        async function runFunctionTests() {
            addInfo('Running function execution tests...');
            try {
                const { instance } = await WebAssembly.instantiate(addWasmBytes);
                const result = instance.exports.add(5, 3);
                addResult('Function Execution (5 + 3)', result === 8, `Expected: 8, Got: ${result}`);
            } catch (e) {
                addResult('Function Execution (5 + 3)', false, e.message);
            }
            try {
                const { instance } = await WebAssembly.instantiate(addWasmBytes);
                const result = instance.exports.add(-5, 3);
                addResult('Function Execution (-5 + 3)', result === -2, `Expected: -2, Got: ${result}`);
            } catch (e) {
                addResult('Function Execution (-5 + 3)', false, e.message);
            }
        }

        async function runMemoryTests() {
            addInfo('Running memory tests...');
            addResult('Memory Export', false, 'Memory tests require WASM module with memory export');
        }

        async function runAllTests() {
            clearResults();
            await runBasicTests();
            await runFunctionTests();
            await runMemoryTests();
            addInfo('All tests completed!');
        }
    </script>
</body>
</html>
