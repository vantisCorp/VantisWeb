; VantisWeb Portable Configuration
; Place this file in the same directory as VantisWeb.exe

[General]
; Enable portable mode
PortableMode=true

; Profile directory (relative to executable)
ProfileDir=profile

; Cache directory (relative to executable)
CacheDir=cache

; Data directory (relative to executable)
DataDir=data

[Settings]
; Disable auto-update checks
DisableAutoUpdate=true

; Disable crash reporting
DisableCrashReporter=true

; Disable telemetry
DisableTelemetry=true

; Use system fonts
UseSystemFonts=true

[Performance]
; Cache size in MB
CacheSizeMB=500

; Disable hardware acceleration (for maximum compatibility)
DisableHardwareAcceleration=false

[Privacy]
; Clear cookies on exit
ClearCookiesOnExit=true

; Clear history on exit
ClearHistoryOnExit=true

; Clear cache on exit
ClearCacheOnExit=true