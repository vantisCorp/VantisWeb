[package]
name = "vantisweb"
version = "1.2.0"
edition = "2021"
authors = ["Vantis Corp"]
description = "Next-gen browser for VantisOS - Liquid Core Architecture"
license = "MIT"
repository = "https://github.com/vantisCorp/VantisWeb"

[dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
directories = "5.0"
hex = "0.4"
toml = "0.8"
rand = "0.8"
url = "2.5"
regex = "1.10"
rusqlite = { version = "0.30", features = ["bundled"] }

# Async runtime
async-trait = "0.1"
futures = "0.3"

# HTTP / Web
urlencoding = "2.1"
base64 = "0.21"

# Encryption
md5 = "0.7"
base32 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"

# WebGPU / Graphics
wgpu = { version = "0.19", features = ["webgl"] }
winit = "0.29"

# Web Engine
webkit2gtk = "2.0"
webview2-com = { version = "0.30", optional = true }

# WebAssembly
wasmi = "0.31"
wasmi_wasi = "0.31"

# Security & Crypto
rust-crypto = "0.2"
blake3 = "1.5"
chacha20poly1305 = "0.10"
ring = "0.17"
postcard = { version = "1.0", features = ["alloc"] }

# AI & Machine Learning
tch = { version = "0.14", optional = true }
ndarray = "0.15"

# Networking
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
hyper = "1.0"
tokio-tungstenite = "0.21"

# Storage
sled = "0.34"
bincode = "1.3"

# UI & Rendering
egui = "0.27"
image = "0.25"
font-kit = "0.13"
unicode-segmentation = "1.11"

# Tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Platform-specific
[target.'cfg(target_os = "linux")'.dependencies]
# webkit2gtk = "0.2"  # Temporarily disabled for MVP compilation

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[dev-dependencies]
criterion = "0.5"
mockall = "0.12"
tempfile = "3.8"

[features]
default = ["web-engine"]
web-engine = ["webview2-com"]
ai-features = ["tch"]
full = ["web-engine", "ai-features"]

[lib]
name = "vantisweb"
path = "src/lib.rs"

[[bin]]
name = "vantisweb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true